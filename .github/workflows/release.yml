name: Release BarAI Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Prepare release files
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"

          # Rinomina DMG senza spazi
          OLD_DMG="${BUNDLE_DIR}/dmg/BarAI Desktop_${VERSION}_universal.dmg"
          NEW_DMG="${BUNDLE_DIR}/dmg/BarAI.Desktop_${VERSION}_universal.dmg"
          mv "${OLD_DMG}" "${NEW_DMG}"

          # Crea tar.gz dell'app per l'updater (Tauri lo genera già, troviamolo)
          APP_TAR_FOUND=$(find "${BUNDLE_DIR}" -name "*.app.tar.gz" | head -1)
          if [ -z "$APP_TAR_FOUND" ]; then
            cd "${BUNDLE_DIR}/macos"
            tar -czf "BarAI.Desktop.app.tar.gz" "BarAI Desktop.app"
            APP_TAR_FOUND="${BUNDLE_DIR}/macos/BarAI.Desktop.app.tar.gz"
            cd -
          fi

          # Firma
          SIG_FILE="${APP_TAR_FOUND}.sig"
          SIG=$(cat "${SIG_FILE}" 2>/dev/null || echo "")

          # URL asset
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/BarAI.Desktop.app.tar.gz"

          # latest.json
          cat > latest.json << EOF
          {
            "version": "${GITHUB_REF_NAME}",
            "notes": "Aggiornamento BarAI Desktop ${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "${SIG}", "url": "${ASSET_URL}" },
              "darwin-x86_64":  { "signature": "${SIG}", "url": "${ASSET_URL}" }
            }
          }
          EOF

          echo "DMG_PATH=${NEW_DMG}" >> $GITHUB_ENV
          echo "APP_TAR_PATH=${APP_TAR_FOUND}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.APP_TAR_PATH }}
            latest.json
          generate_release_notes: true
