name: Release BarAI Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BarAI Desktop ${{ github.ref_name }}'
          releaseBody: 'Aggiornamento automatico BarAI Desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      - name: Leggi firma e salvala in /tmp PRIMA del checkout
        run: |
          echo "=== File .sig nel build ==="
          find src-tauri/target -name "*.sig" 2>/dev/null
          echo "==========================="

          # Trova il file di firma e copialo in /tmp PRIMA che git checkout lo cancelli
          SIG_FILE=$(find src-tauri/target -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            cp "$SIG_FILE" /tmp/barai_update.sig
            echo "Firma salvata in /tmp/barai_update.sig ($(wc -c < /tmp/barai_update.sig) bytes)"
          else
            echo "ATTENZIONE: firma non trovata, scrivo placeholder vuoto"
            echo -n "" > /tmp/barai_update.sig
          fi

      - name: Aggiorna latest.json nel repository
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/BarAI.Desktop_universal.app.tar.gz"
          SIG=$(cat /tmp/barai_update.sig)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > /tmp/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Aggiornamento BarAI Desktop ${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "${SIG}", "url": "${ASSET_URL}" },
              "darwin-x86_64":  { "signature": "${SIG}", "url": "${ASSET_URL}" }
            }
          }
          EOF

          git fetch origin main
          git checkout -f main
          git reset --hard origin/main
          cp /tmp/latest.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: aggiorna latest.json a ${{ github.ref_name }}"
          git push origin main

      - name: Carica latest.json corretto nella release
        run: |
          gh release upload ${{ github.ref_name }} /tmp/latest.json --repo ${{ github.repository }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
