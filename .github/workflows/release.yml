name: Release BarAI Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Prepare release files
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"

          # Rinomina DMG
          OLD_DMG=$(find "${BUNDLE_DIR}/dmg" -name "*.dmg" | head -1)
          NEW_DMG="${BUNDLE_DIR}/dmg/BarAI.Desktop_${VERSION}_universal.dmg"
          mv "${OLD_DMG}" "${NEW_DMG}"

          # Crea tar.gz per l'updater
          NEW_TAR="${BUNDLE_DIR}/macos/BarAI.Desktop.app.tar.gz"
          cd "${BUNDLE_DIR}/macos"
          tar -czf "BarAI.Desktop.app.tar.gz" "BarAI Desktop.app"
          cd -
          ls -lh "${NEW_TAR}"

          # latest.json senza firma (pubkey vuota in tauri.conf.json)
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/BarAI.Desktop.app.tar.gz"
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Aggiornamento BarAI Desktop v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "", "url": "${ASSET_URL}" },
              "darwin-x86_64":  { "signature": "", "url": "${ASSET_URL}" }
            }
          }
          EOF
          cat latest.json

          echo "DMG_PATH=${NEW_DMG}" >> $GITHUB_ENV
          echo "APP_TAR_PATH=${NEW_TAR}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.APP_TAR_PATH }}
            latest.json
          generate_release_notes: true
