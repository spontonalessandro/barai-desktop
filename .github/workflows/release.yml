name: Release BarAI Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BarAI Desktop ${{ github.ref_name }}'
          releaseBody: 'Aggiornamento automatico BarAI Desktop ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      - name: Aggiorna latest.json nel repository
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/BarAI.Desktop_${VERSION}_universal.app.tar.gz"

          # Trova il file di firma generato da tauri-action
          SIG_FILE=$(find src-tauri/target -name "*.app.tar.gz.sig" | head -1)
          SIG=""
          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
            echo "Firma trovata (${#SIG} caratteri)"
          else
            echo "ATTENZIONE: firma non trovata"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > /tmp/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Aggiornamento BarAI Desktop ${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "${SIG}", "url": "${ASSET_URL}" },
              "darwin-x86_64":  { "signature": "${SIG}", "url": "${ASSET_URL}" }
            }
          }
          EOF

          git fetch origin main
          git checkout -f main
          git reset --hard origin/main
          cp /tmp/latest.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: aggiorna latest.json a ${{ github.ref_name }}"
          git push origin main
