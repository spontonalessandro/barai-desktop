name: Release BarAI Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Prepare release files
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"

          # Rinomina DMG senza spazi
          OLD_DMG="${BUNDLE_DIR}/dmg/BarAI Desktop_${VERSION}_universal.dmg"
          NEW_DMG="${BUNDLE_DIR}/dmg/BarAI.Desktop_${VERSION}_universal.dmg"
          mv "${OLD_DMG}" "${NEW_DMG}"

          # Trova il tar.gz generato da Tauri per l'updater
          APP_TAR_FOUND=$(find "${BUNDLE_DIR}" -name "*.app.tar.gz" | head -1)
          echo "APP_TAR trovato: ${APP_TAR_FOUND}"

          # Firma: Tauri genera il .sig accanto al tar.gz
          SIG=""
          if [ -n "${APP_TAR_FOUND}" ] && [ -f "${APP_TAR_FOUND}.sig" ]; then
            SIG=$(cat "${APP_TAR_FOUND}.sig")
            echo "Firma trovata: OK"
          else
            echo "ATTENZIONE: file .sig non trovato"
            find "${BUNDLE_DIR}" -name "*.sig" 2>/dev/null || true
          fi

          # Rinomina tar.gz senza spazi
          NEW_TAR="${BUNDLE_DIR}/macos/BarAI.Desktop.app.tar.gz"
          if [ -n "${APP_TAR_FOUND}" ] && [ "${APP_TAR_FOUND}" != "${NEW_TAR}" ]; then
            cp "${APP_TAR_FOUND}" "${NEW_TAR}"
          fi

          # URL asset
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/BarAI.Desktop.app.tar.gz"

          # latest.json — versione SENZA "v" per confronto corretto
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Aggiornamento BarAI Desktop v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "${SIG}", "url": "${ASSET_URL}" },
              "darwin-x86_64":  { "signature": "${SIG}", "url": "${ASSET_URL}" }
            }
          }
          EOF

          echo "--- latest.json ---"
          cat latest.json

          echo "DMG_PATH=${NEW_DMG}" >> $GITHUB_ENV
          echo "APP_TAR_PATH=${NEW_TAR}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.APP_TAR_PATH }}
            latest.json
          generate_release_notes: true
