[package]
name = "barai-desktop"
version = "0.9.1"
description = "BarAI Desktop - gestionale locale per bar con SQLite"
authors = ["BarAI"]
edition = "2021"

[lib]
name = "barai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
